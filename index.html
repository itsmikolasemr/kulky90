<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KULKY 90</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;background:#2b2824;color:#f4efe4;font-family:-apple-system,sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh}
.top{flex-shrink:0;display:flex;justify-content:space-between;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:#3a3530}
.brand{letter-spacing:.16em;font-weight:700;font-size:13px}
.brand span{color:#c9a24a}
.st{font-size:12px;color:#d7cbb4}
.wrap{position:relative;flex:1;min-height:260px;background:#2a261f}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bar{flex-shrink:0;display:flex;gap:8px;padding:10px 12px max(16px,env(safe-area-inset-bottom));background:#241f1b}
.bar button{flex:1;height:44px;border:0;border-radius:8px;background:#4a433b;color:#f4efe4;font-weight:650;font-size:12px}
.bar .p{background:#c9a24a;color:#1a1408}
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:9}
.sheet.on{display:flex}
.panel{width:100%;max-height:80%;overflow:auto;background:#2c2823;border-radius:16px 16px 0 0;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;background:#3a342d;border-radius:10px;padding:12px;margin:8px 0}
.row button{height:34px;border:0;border-radius:7px;background:#c9a24a;color:#1a1408;font-weight:700;padding:0 12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111c;padding:8px 12px;border-radius:8px;display:none;z-index:10}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">KULKY <span>90</span></div><div class="st" id="hud">Lv 1</div></div>
  <div class="wrap"><canvas id="c"></canvas></div>
  <div class="bar">
    <button id="bPlace">Misto</button>
    <button id="bPlay" class="p">Dalsi kolo</button>
  </div>
</div>
<div class="sheet" id="sheet"><div class="panel" id="plist"></div></div>
<div class="toast" id="toast"></div>
<script>
const PL=[
 {n:'Skolni dvorek',sky:['#7eb0d8','#f2e4c0'],gnd:['#6a6860','#3e3c38'],acc:'#f4efe4',k:'school'},
 {n:'Pred Discolandem',sky:['#1a1030','#3a1858'],gnd:['#2a1a28','#1a1014'],acc:'#ff4d9a',k:'disco'},
 {n:'Pred Mirovem',sky:['#6a7a88','#c5c8c2'],gnd:['#4a4a46','#2e2e2a'],acc:'#8a9080',k:'prison'},
 {n:'Karluv most',sky:['#6ea0c8','#f0d2a0'],gnd:['#8a7a68','#5a4a3a'],acc:'#c9a24a',k:'bridge'},
 {n:'Sidliste',sky:['#87a0b8','#d8c8b0'],gnd:['#9a8a6a','#6a5a40'],acc:'#c45c3a',k:'panel'},
 {n:'Pred vecerkou',sky:['#3a2a48','#8a4060'],gnd:['#3a3230','#1e1a18'],acc:'#e8b030',k:'shop'}
];
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const S={place:0,turn:'you',xp:0,coins:40,aim:0,ap:null,balls:[]};
let f={w:390,h:640,cx:195,cy:300,R:120};
function resize(){
 const h=cvs.parentElement.clientHeight||innerHeight-120;
 f={w:innerWidth,h:h,cx:innerWidth/2,cy:h*0.48,R:Math.min(innerWidth,h)*0.26};
 const d=Math.min(devicePixelRatio||1,2);
 cvs.width=f.w*d;cvs.height=f.h*d;ctx.setTransform(d,0,0,d,0,0);
}
function marble(x,y,r,h,s,l){
 const g=ctx.createRadialGradient(x-r*.3,y-r*.35,2,x,y,r);
 g.addColorStop(0,'hsl('+h+' '+s+'% '+Math.min(l+25,95)+'%)');
 g.addColorStop(1,'hsl('+h+' '+s+'% '+Math.max(l-25,8)+'%)');
 ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#0004';ctx.stroke();
}
function placeBg(){
 const p=PL[S.place];
 const a=ctx.createLinearGradient(0,0,0,f.h*.5);a.addColorStop(0,p.sky[0]);a.addColorStop(1,p.sky[1]);
 ctx.fillStyle=a;ctx.fillRect(0,0,f.w,f.h*.5);
 const b=ctx.createLinearGradient(0,f.h*.48,0,f.h);b.addColorStop(0,p.gnd[0]);b.addColorStop(1,p.gnd[1]);
 ctx.fillStyle=b;ctx.fillRect(0,f.h*.48,f.w,f.h*.52);
 if(p.k==='disco'){ctx.fillStyle='#120814';ctx.fillRect(f.w*.2,f.h*.18,f.w*.6,f.h*.28);ctx.fillStyle='#ff4d9a';ctx.font='bold 14px sans-serif';ctx.fillText('DISCOLAND',f.w*.32,f.h*.16)}
 if(p.k==='prison'){ctx.fillStyle='#5a5e58';ctx.fillRect(0,f.h*.2,f.w,f.h*.28);ctx.fillStyle='#ddd';ctx.font='12px sans-serif';ctx.fillText('VEZNICE MIROV',16,f.h*.18)}
 if(p.k==='bridge'){ctx.strokeStyle='#8a7a62';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,f.h*.34);ctx.quadraticCurveTo(f.w/2,f.h*.14,f.w,f.h*.34);ctx.stroke()}
 if(p.k==='panel'){for(let i=0;i<3;i++){ctx.fillStyle='#9aa8b0';ctx.fillRect(12+i*f.w/3,f.h*.1,f.w*.26,f.h*.36)}}
 if(p.k==='shop'){ctx.fillStyle='#e8b030';ctx.fillRect(f.w*.14,f.h*.16,f.w*.72,22);ctx.fillStyle='#2a2420';ctx.fillRect(f.w*.14,f.h*.22,f.w*.72,f.h*.24)}
 if(p.k==='school'){ctx.fillStyle='#c45c3a';ctx.fillRect(f.w*.1,f.h*.14,f.w*.8,f.h*.32);ctx.fillStyle='#f4efe4';ctx.fillRect(f.w*.18,f.h*.2,f.w*.18,f.h*.1)}
}
function deal(){
 S.balls=[];S.turn='you';
 S.balls.push({x:f.cx-20,y:f.cy+f.R+70,vx:0,vy:0,r:15,you:1,h:210,s:55,l:50});
 S.balls.push({x:f.cx+20,y:f.cy+f.R+70,vx:0,vy:0,r:15,bot:1,h:142,s:48,l:42});
 for(let i=0;i<5;i++){const a=i/5*6.28+.2,rr=f.R*.42;
  S.balls.push({x:f.cx+Math.cos(a)*rr,y:f.cy+Math.sin(a)*rr,vx:0,vy:0,r:13,en:1,h:20+i*40,s:50,l:45});
 }
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},1800)}
function step(){
 let mv=0;
 for(const b of S.balls){
  b.x+=b.vx;b.y+=b.vy;b.vx*=.985;b.vy*=.985;
  if(Math.hypot(b.vx,b.vy)<.05){b.vx=0;b.vy=0}else mv=1;
  if(b.x<16){b.x=16;b.vx*=-.4} if(b.x>f.w-16){b.x=f.w-16;b.vx*=-.4}
  if(b.y<16){b.y=16;b.vy*=-.4} if(b.y>f.h-16){b.y=f.h-16;b.vy*=-.4}
 }
 for(let i=0;i<S.balls.length;i++)for(let j=i+1;j<S.balls.length;j++){
  const a=S.balls[i],b=S.balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,m=a.r+b.r;
  if(d<m){const nx=dx/d,ny=dy/d,o=m-d;a.x-=nx*o/2;a.y-=ny*o/2;b.x+=nx*o/2;b.y+=ny*o/2;
   const va=a.vx*nx+a.vy*ny,vb=b.vx*nx+b.vy*ny;a.vx+=(vb-va)*nx;a.vy+=(vb-va)*ny;b.vx+=(va-vb)*nx;b.vy+=(va-vb)*ny}
 }
 if(S.aim&&!mv){
  S.aim=0;
  if(S.turn==='you'){S.turn='bot';toast('Pepa hazi');setTimeout(bot,600)}
  else{S.turn='you';const k=S.balls.filter(b=>b.en&&Math.hypot(b.x-f.cx,b.y-f.cy)>f.R).length;S.xp+=8+k*10;S.coins+=4+k*6;toast('Venku '+k);hud()}
 }
}
function bot(){
 const b=S.balls.find(x=>x.bot);const t=S.balls.find(x=>x.en&&Math.hypot(x.x-f.cx,x.y-f.cy)<=f.R)||{x:f.cx,y:f.cy};
 const dx=t.x-b.x+(Math.random()-.5)*30,dy=t.y-b.y+(Math.random()-.5)*30,d=Math.hypot(dx,dy)||1;
 b.vx=dx/d*11;b.vy=dy/d*11;S.aim=1;
}
function paint(){
 ctx.clearRect(0,0,f.w,f.h);placeBg();
 ctx.beginPath();ctx.arc(f.cx,f.cy,f.R,0,7);ctx.setLineDash([6,5]);ctx.strokeStyle=PL[S.place].acc;ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);
 if(S.ap){const y=S.balls.find(b=>b.you);ctx.beginPath();ctx.moveTo(y.x,y.y);ctx.lineTo(S.ap.x,S.ap.y);ctx.strokeStyle='#c9a24a';ctx.stroke()}
 for(const b of S.balls)marble(b.x,b.y,b.r,b.h,b.s,b.l);
 ctx.fillStyle='#0008';ctx.fillRect(12,8,f.w-24,28);
 ctx.fillStyle='#f4efe4';ctx.font='12px sans-serif';ctx.fillText(PL[S.place].n+' vs Pepa  '+(S.turn==='you'?'Tvuj hod':'Bot'),20,26);
}
function hud(){document.getElementById('hud').textContent='Lv '+Math.max(1,Math.floor(S.xp/80)+1)+' · '+S.coins+' Kc'}
function loop(){step();paint();requestAnimationFrame(loop)}
function pos(e){const r=cvs.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
cvs.addEventListener('pointerdown',e=>{if(S.turn!=='you'||S.aim)return;const y=S.balls.find(b=>b.you),p=pos(e);if(Math.hypot(p.x-y.x,p.y-y.y)<48){S.ap=p;cvs.setPointerCapture(e.pointerId)}});
cvs.addEventListener('pointermove',e=>{if(S.ap)S.ap=pos(e)});
cvs.addEventListener('pointerup',()=>{if(!S.ap)return;const y=S.balls.find(b=>b.you);const dx=y.x-S.ap.x,dy=y.y-S.ap.y;const pw=Math.min(Math.hypot(dx,dy),140)/12;const an=Math.atan2(dy,dx);y.vx=Math.cos(an)*pw;y.vy=Math.sin(an)*pw;S.ap=null;S.aim=1});
document.getElementById('bPlay').onclick=function(){deal();toast('Nove kolo')};
document.getElementById('bPlace').onclick=function(){
 const sh=document.getElementById('sheet'),box=document.getElementById('plist');
 box.innerHTML='<h3>Kde se hraje</h3>';
 PL.forEach(function(p,i){const d=document.createElement('div');d.className='row';d.innerHTML='<div>'+p.n+'</div><button>Hrat</button>';
 d.querySelector('button').onclick=function(){S.place=i;deal();sh.classList.remove('on')};box.appendChild(d)});
 sh.classList.add('on');
};
addEventListener('resize',function(){resize();deal()});
resize();deal();hud();loop();
</script>
</body>
</html>
